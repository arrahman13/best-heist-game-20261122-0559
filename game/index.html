<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Run — Heist Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Verdana, sans-serif; }
  #wrap { width: 960px; }
  #game { display: block; width: 960px; height: 640px; background: #141a26; cursor: crosshair;
          box-shadow: 0 0 0 1px #2c3a52, 0 12px 48px rgba(0,0,0,.7); }
  #help { color: #8fa3c0; font-size: 13px; text-align: center; margin: 10px 0 0; line-height: 1.5; }
  #help b { color: #e8c15a; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640" aria-label="Vault Run: cross the vault room, dodge guard and camera vision cones, grab the loot and escape"></canvas>
  <p id="help">Move <b>WASD / Arrow keys</b> &nbsp;·&nbsp; <b>E</b> or click <b>EMP</b> — lights-out, cameras offline 5s &nbsp;·&nbsp; Grab the <b>vault</b>, then reach the <b>green exit</b> before the getaway timer ends &nbsp;·&nbsp; Stay out of the red cones or the alarm fills</p>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./main.js"></script>
</body>
</html>
